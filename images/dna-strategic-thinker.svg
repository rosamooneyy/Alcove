<svg viewBox="0 0 480 600" xmlns="http://www.w3.org/2000/svg" width="480" height="600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F5F3EE"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="480" height="600" rx="16" fill="url(#bg)" stroke="#E0DDD8" stroke-width="1"/>

  <!-- Header -->
  <text x="40" y="48" font-size="11" fill="#8B8680" letter-spacing="0.08em" font-weight="400">READER DNA</text>
  <text x="40" y="84" font-size="28" fill="#3E2C1C" font-weight="700">The Strategic Thinker</text>
  <text x="40" y="110" font-size="15" fill="#6B6560" font-style="italic">Knowledge is your superpower</text>

  <!-- Accent bar -->
  <rect x="40" y="124" width="60" height="3" rx="1.5" fill="#5b7a9b"/>

  <!-- Description -->
  <text x="40" y="156" font-size="13.5" fill="#5A5550" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <tspan x="40" dy="0">You gravitate toward non-fiction and ideas that</tspan>
    <tspan x="40" dy="20">sharpen your mind. Books are tools for growth,</tspan>
    <tspan x="40" dy="20">and you finish what you start.</tspan>
  </text>

  <!-- Metrics -->
  <!-- Completion Rate -->
  <text x="40" y="240" font-size="13" fill="#3E2C1C" font-weight="600">Completion Rate</text>
  <text x="40" y="256" font-size="10.5" fill="#8B8680" font-family="'Segoe UI', Helvetica, Arial, sans-serif">12 finished</text>
  <rect x="200" y="242" width="220" height="10" rx="5" fill="#E8E5E0"/>
  <rect x="200" y="242" width="198" height="10" rx="5" fill="#5b7a9b"/>
  <text x="430" y="252" font-size="12" fill="#3E2C1C" font-weight="600" text-anchor="end">90%</text>

  <!-- Genre Diversity -->
  <text x="40" y="296" font-size="13" fill="#3E2C1C" font-weight="600">Genre Diversity</text>
  <text x="40" y="312" font-size="10.5" fill="#8B8680" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Variety across genres</text>
  <rect x="200" y="298" width="220" height="10" rx="5" fill="#E8E5E0"/>
  <rect x="200" y="298" width="88" height="10" rx="5" fill="#5b7a9b"/>
  <text x="430" y="308" font-size="12" fill="#3E2C1C" font-weight="600" text-anchor="end">40%</text>

  <!-- Emotional Intensity -->
  <text x="40" y="352" font-size="13" fill="#3E2C1C" font-weight="600">Emotional Intensity</text>
  <text x="40" y="368" font-size="10.5" fill="#8B8680" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Romance, drama, literary fiction</text>
  <rect x="200" y="354" width="220" height="10" rx="5" fill="#E8E5E0"/>
  <rect x="200" y="354" width="55" height="10" rx="5" fill="#5b7a9b"/>
  <text x="430" y="364" font-size="12" fill="#3E2C1C" font-weight="600" text-anchor="end">25%</text>

  <!-- Fiction Ratio -->
  <text x="40" y="408" font-size="13" fill="#3E2C1C" font-weight="600">Fiction Ratio</text>
  <text x="40" y="424" font-size="10.5" fill="#8B8680" font-family="'Segoe UI', Helvetica, Arial, sans-serif">65% nonfiction</text>
  <rect x="200" y="410" width="220" height="10" rx="5" fill="#E8E5E0"/>
  <rect x="200" y="410" width="77" height="10" rx="5" fill="#5b7a9b"/>
  <text x="430" y="420" font-size="12" fill="#3E2C1C" font-weight="600" text-anchor="end">35%</text>

  <!-- Engagement Score -->
  <text x="40" y="464" font-size="13" fill="#3E2C1C" font-weight="600">Engagement Score</text>
  <text x="40" y="480" font-size="10.5" fill="#8B8680" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Ratings, reviews, quotes, tropes</text>
  <rect x="200" y="466" width="220" height="10" rx="5" fill="#E8E5E0"/>
  <rect x="200" y="466" width="132" height="10" rx="5" fill="#5b7a9b"/>
  <text x="430" y="476" font-size="12" fill="#3E2C1C" font-weight="600" text-anchor="end">60%</text>

  <!-- Footer -->
  <line x1="40" y1="520" x2="440" y2="520" stroke="#E0DDD8" stroke-width="1"/>
  <text x="40" y="546" font-size="11.5" fill="#8B8680" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Based on 15 books analyzed</text>

  <!-- Alcove branding -->
  <circle cx="40" cy="576" r="4" fill="#F5A07A"/>
  <circle cx="52" cy="576" r="4" fill="#7AB8F5"/>
  <circle cx="40" cy="588" r="4" fill="#6B3A5C"/>
  <text x="62" y="585" font-size="14" fill="#3E2C1C" font-weight="700">Alcove</text>
</svg>
