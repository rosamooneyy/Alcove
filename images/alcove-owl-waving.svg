<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" width="512" height="512">
  <!-- Open Book -->
  <g>
    <rect x="18" y="88" width="38" height="26" rx="2" fill="#FAFAF8"
          transform="rotate(-4 37 101)" stroke="#E0DDD8" stroke-width="0.5"/>
    <rect x="64" y="88" width="38" height="26" rx="2" fill="#FAFAF8"
          transform="rotate(4 83 101)" stroke="#E0DDD8" stroke-width="0.5"/>
    <line x1="60" y1="86" x2="60" y2="114" stroke="#E0DDD8" stroke-width="1.5"/>
    <line x1="28" y1="95" x2="50" y2="94" stroke="#E0DDD8" stroke-width="0.5" opacity="0.4"/>
    <line x1="28" y1="99" x2="50" y2="98" stroke="#E0DDD8" stroke-width="0.5" opacity="0.4"/>
    <line x1="28" y1="103" x2="48" y2="102" stroke="#E0DDD8" stroke-width="0.5" opacity="0.4"/>
    <line x1="70" y1="94" x2="92" y2="95" stroke="#E0DDD8" stroke-width="0.5" opacity="0.4"/>
    <line x1="70" y1="98" x2="92" y2="99" stroke="#E0DDD8" stroke-width="0.5" opacity="0.4"/>
    <line x1="70" y1="102" x2="90" y2="103" stroke="#E0DDD8" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Owl Body -->
  <g>
    <ellipse cx="60" cy="58" rx="30" ry="34" fill="#6B3A5C"/>
    <ellipse cx="60" cy="65" rx="20" ry="22" fill="#F5A07A"/>
    <path d="M48,55 Q52,60 48,65 Q52,70 48,75" stroke="#6B3A5C" stroke-width="0.8" fill="none" opacity="0.3"/>
    <path d="M56,53 Q60,58 56,63 Q60,68 56,73 Q60,78 56,82" stroke="#6B3A5C" stroke-width="0.8" fill="none" opacity="0.3"/>
    <path d="M64,53 Q68,58 64,63 Q68,68 64,73 Q68,78 64,82" stroke="#6B3A5C" stroke-width="0.8" fill="none" opacity="0.3"/>
    <path d="M72,55 Q76,60 72,65 Q76,70 72,75" stroke="#6B3A5C" stroke-width="0.8" fill="none" opacity="0.3"/>

    <!-- Ear Tufts -->
    <polygon points="36,22 42,38 30,34" fill="#6B3A5C"/>
    <polygon points="84,22 78,38 90,34" fill="#6B3A5C"/>
    <polygon points="37,24 41,35 32,32" fill="#F5A07A" opacity="0.3"/>
    <polygon points="83,24 79,35 88,32" fill="#F5A07A" opacity="0.3"/>

    <!-- Open Eyes -->
    <circle cx="46" cy="45" r="11" fill="white"/>
    <circle cx="74" cy="45" r="11" fill="white"/>
    <circle cx="47" cy="45" r="6" fill="#1A1A1A"/>
    <circle cx="75" cy="45" r="6" fill="#1A1A1A"/>
    <circle cx="49" cy="43" r="2" fill="white"/>
    <circle cx="77" cy="43" r="2" fill="white"/>

    <!-- Glasses -->
    <circle cx="46" cy="45" r="13" fill="none" stroke="#7AB8F5" stroke-width="1.5"/>
    <circle cx="74" cy="45" r="13" fill="none" stroke="#7AB8F5" stroke-width="1.5"/>
    <line x1="59" y1="45" x2="61" y2="45" stroke="#7AB8F5" stroke-width="1.5"/>
    <line x1="33" y1="44" x2="28" y2="40" stroke="#7AB8F5" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="87" y1="44" x2="92" y2="40" stroke="#7AB8F5" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Beak -->
    <path d="M56,56 L60,62 L64,56 Z" fill="#F5A07A"/>

    <!-- Left Wing (normal) -->
    <ellipse cx="30" cy="62" rx="10" ry="18" fill="#6B3A5C" transform="rotate(10 30 62)"/>
    <!-- Right Wing (raised, waving) -->
    <ellipse cx="92" cy="52" rx="10" ry="16" fill="#6B3A5C" transform="rotate(-30 92 52)"/>

    <!-- Feet -->
    <ellipse cx="48" cy="90" rx="7" ry="3" fill="#7AB8F5"/>
    <ellipse cx="72" cy="90" rx="7" ry="3" fill="#7AB8F5"/>
  </g>
</svg>
